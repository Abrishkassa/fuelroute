<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel Route Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c2430; --muted:#5d6b7c; --line:#dde2e8; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151c; --panel:#18202a; --text:#e6ebf1; --muted:#97a4b4; --line:#2a3542; --accent:#58a6ff; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; }
  aside { width:360px; max-width:42vw; padding:16px; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); }
  #map { flex:1; }
  h1 { font-size:18px; margin:0 0 12px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font:inherit; }
  button { margin-top:12px; width:100%; padding:10px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .error { margin-top:12px; padding:10px; border-radius:6px; background:#fdecea; color:#8a1c14; }
  .summary { margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { padding:10px; border:1px solid var(--line); border-radius:6px; }
  .stat b { display:block; font-size:18px; }
  .stat span { font-size:12px; color:var(--muted); }
  .note { font-size:12px; color:var(--muted); margin-top:8px; }
  ol { padding-left:0; list-style:none; margin:16px 0 0; }
  li.stop { padding:10px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; cursor:pointer; }
  li.stop small { color:var(--muted); display:block; }
  @media (max-width:700px) { body { flex-direction:column-reverse; } aside { width:100%; max-width:none; height:45vh; } }
</style>
</head>
<body>
<aside>
  <h1>Fuel Route Planner</h1>
  <label for="start">Start (City, ST or lat,lng)</label>
  <input id="start" value="Dallas, TX">
  <label for="finish">Finish</label>
  <input id="finish" value="Atlanta, GA">
  <button id="go">Plan route</button>
  <div id="error" class="error" hidden></div>
  <div id="result" hidden>
    <div class="summary" id="summary"></div>
    <div class="note" id="note"></div>
    <ol id="stops"></ol>
  </div>
</aside>
<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const map = L.map('map').setView([39.5, -98.35], 4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  let layer = L.layerGroup().addTo(map);

  const $ = id => document.getElementById(id);
  const money = n => '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

  function stat(label, value) {
    const d = document.createElement('div'); d.className = 'stat';
    const b = document.createElement('b'); b.textContent = value;
    const s = document.createElement('span'); s.textContent = label;
    d.append(b, s); return d;
  }

  function showError(msg) { const e = $('error'); e.textContent = msg; e.hidden = !msg; }

  function render(data) {
    layer.clearLayers();
    const coords = data.route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
    const line = L.polyline(coords, {color: '#1f6feb', weight: 5}).addTo(layer);

    const pin = (p, label, color) => L.circleMarker([p.lat, p.lng], {radius: 8, color, fillColor: color, fillOpacity: 1})
      .bindTooltip(label).addTo(layer);
    pin(data.start, 'Start: ' + data.start.label, '#2da44e');
    pin(data.finish, 'Finish: ' + data.finish.label, '#cf222e');

    const list = $('stops'); list.replaceChildren();
    data.fuel_stops.forEach((s, i) => {
      const m = L.marker([s.latitude, s.longitude]).addTo(layer);
      const html = document.createElement('div');
      html.textContent = `${i + 1}. ${s.name} — ${s.city}, ${s.state}: ${s.gallons_purchased} gal @ ${money(s.price_per_gallon)} = ${money(s.cost)}`;
      m.bindPopup(html);

      const li = document.createElement('li'); li.className = 'stop';
      const t = document.createElement('div'); t.textContent = `${i + 1}. ${s.name}`;
      const sm = document.createElement('small');
      sm.textContent = `Mile ${s.mile_marker} · ${s.city}, ${s.state} · ${s.address}`;
      const sm2 = document.createElement('small');
      sm2.textContent = `${s.gallons_purchased} gal @ ${money(s.price_per_gallon)} = ${money(s.cost)}`;
      li.append(t, sm, sm2);
      li.onclick = () => { map.setView([s.latitude, s.longitude], 9); m.openPopup(); };
      list.append(li);
    });

    const sum = $('summary'); sum.replaceChildren(
      stat('Distance', data.distance_miles + ' mi'),
      stat('Total fuel', data.total_gallons + ' gal'),
      stat('Total cost', money(data.total_fuel_cost)),
      stat('Stops', String(data.fuel_stops.length)),
    );
    const b = data.cost_breakdown;
    $('note').textContent = `Bought at stops: ${money(b.purchased_at_stops)}. Starting tank (${data.assumptions.start_fuel_miles} mi) `
      + `priced at the corridor average, ${money(data.assumptions.starting_tank_priced_at)}/gal: ${money(b.starting_tank)}. `
      + `Station positions are city-level (±a few miles).`;
    $('result').hidden = false;
    map.fitBounds(line.getBounds(), {padding: [30, 30]});
  }

  async function plan() {
    showError(''); $('go').disabled = true; $('go').textContent = 'Planning…';
    try {
      const qs = new URLSearchParams({start: $('start').value, finish: $('finish').value});
      const res = await fetch('/api/route/?' + qs);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || JSON.stringify(data));
      render(data);
    } catch (err) {
      $('result').hidden = true; showError(err.message || 'Request failed');
    } finally {
      $('go').disabled = false; $('go').textContent = 'Plan route';
    }
  }
  $('go').onclick = plan;
  document.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') plan(); }));
</script>
</body>
</html>
